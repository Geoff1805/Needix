name: Deploy Needix Web App to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages (needix.app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=needix
